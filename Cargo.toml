[package]
name = "strokebind"
version = "0.0.1"
edition = "2021"
rust-version = "1.85.1"
description = "Mouse-stroke gestures for any Linux Wayland compositor (and X11)"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["wayland", "mouse", "gestures", "evdev", "linux"]
categories = ["command-line-utilities", "os::linux-apis"]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
evdev = "0.13"
signal-hook = "0.3"
notify = "8"

[lints.rust]
unsafe_code = "deny"      # only src/sys/ may `#![allow(unsafe_code)]`, each use documented
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "allow"

[dev-dependencies]
proptest = "1"
tempfile = "3"
