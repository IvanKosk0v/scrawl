[package]
name = "strokebind"
version = "0.0.1"
edition = "2021"
# Provisional. Task M0.4 determines the real MSRV with cargo-msrv and CI enforces it.
rust-version = "1.85"
description = "Mouse-stroke gestures for any Linux Wayland compositor (and X11)"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["wayland", "mouse", "gestures", "evdev", "linux"]
categories = ["command-line-utilities", "os::linux-apis"]

[dependencies]
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[lints.rust]
unsafe_code = "deny"      # only src/sys/ may `#![allow(unsafe_code)]`, each use documented
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "allow"
