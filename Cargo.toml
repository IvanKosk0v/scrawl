[package]
name = "scrawld"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.1"
description = "Mouse-stroke gestures for any Linux Wayland compositor (and X11)"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/IvanKosk0v/scrawl"
keywords = ["wayland", "mouse", "gestures", "evdev", "linux"]
categories = ["command-line-utilities", "os::linux-apis"]

[lib]
name = "scrawl"
path = "src/lib.rs"

[[bin]]
name = "scrawl"
path = "src/main.rs"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
evdev = "0.13"
signal-hook = "0.3"
notify = "8"
x11rb = { version = "0.13", features = ["shape", "xfixes"] }
serde_json = "1"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
smithay-client-toolkit = { version = "0.20", default-features = false }

[lints.rust]
unsafe_code = "deny"      # only src/sys/ may `#![allow(unsafe_code)]`, each use documented
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "allow"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[package.metadata.deb]
name = "scrawl"
maintainer = "Ivan Koskov"
section = "utils"
priority = "optional"
extended-description = "Runs actions on mouse-stroke gestures, via evdev grab and uinput, on any Wayland compositor or X11."
maintainer-scripts = "packaging/debian"
assets = [
    ["target/release/scrawl", "usr/bin/", "755"],
    ["packaging/scrawl-deb.service", "usr/lib/systemd/user/scrawl.service", "644"],
    ["packaging/70-scrawl.rules", "usr/lib/udev/rules.d/70-scrawl.rules", "644"],
    ["packaging/config.example.toml", "usr/share/doc/scrawl/", "644"],
    ["README.md", "usr/share/doc/scrawl/", "644"],
]
