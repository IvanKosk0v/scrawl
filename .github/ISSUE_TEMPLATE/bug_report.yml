name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: input
    id: compositor
    attributes:
      label: Compositor / desktop and version
      placeholder: "Hyprland 0.4x, GNOME 4x on Wayland, KDE Plasma 6.x, X11 + bspwm ..."
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distro and kernel
    validations:
      required: true
  - type: input
    id: mouse
    attributes:
      label: Mouse model
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output of `strokebind record` or logs (RUST_LOG=debug)
      render: shell
